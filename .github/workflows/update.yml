name: update-news
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python fetch.py
      - run: |
          git config user.name "news-bot"
          git config user.email "bot@example.com"
          git add data.json history.json
          git diff --cached --quiet || git commit -m "update news"
          git push
